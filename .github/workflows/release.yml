name: Release DMG

# Releases are published from a Mac with the signing certificate (scripts/release.sh <version> --publish).
# This only checks that the pipeline still builds a DMG, signed ad-hoc, and keeps it as an artifact.
on:
  pull_request:
    paths:
      - scripts/build-app.sh
      - scripts/release.sh
      - scripts/dmg-settings.py
      - design/installer/**
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  dmg:
    runs-on: xcode-27
    env:
      SIGN_IDENTITY: "-"
      ALLOW_ADHOC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build DMG
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw Support/Info.plist)-ci.$GITHUB_RUN_NUMBER"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          scripts/release.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Hyperpoint-${{ env.VERSION }}
          path: dist/
