name: Site

# Checks the site's build on pull requests and deploys it to hyperpoint.progremir.dev on pushes to main.
on:
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx cf build
      - run: npx cf deploy --prebuilt --dry-run
      - name: Deploy
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN repository secret that can deploy Workers and their custom domains."
            exit 1
          fi
          npx cf deploy --prebuilt --message "${GITHUB_SHA::7}"
