name: Site

# Checks that the site still builds on pull requests that touch it. Deploys to hyperpoint.progremir.dev run in
# Cloudflare's Workers Builds on pushes to main, not here.
on:
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx cf build
      - run: npx cf deploy --prebuilt --dry-run
